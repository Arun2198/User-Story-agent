# Model names and the provider settings live here only.
# Provider: NVIDIA-hosted models through an OpenAI-style endpoint. The key is read from the
# environment variable named by api_key_env; it is never stored in a file.
base_url: https://integrate.api.nvidia.com/v1
api_key_env: NVIDIA_API_KEY
# One NVIDIA key works for every model, so a single variable is enough.
# How the JSON schema is enforced. Models differ, so the default tries each in turn and keeps
# the first one the model accepts:
#   guided_json: NVIDIA's nvext.guided_json     json_schema: OpenAI-style response_format
#   none: the schema goes in the prompt and the reply is checked afterwards
# Set one of them here to skip the trial.
structured_output: auto
# Extra request fields per model id, merged into every request for that model. Thinking is left
# on, because these models need it to answer well. To switch it off for a model, for example:
#   extra_body:
#     nvidia/nemotron-3.5-lightning-30b-a3b: { chat_template_kwargs: { enable_thinking: false } }
extra_body: {}
temperature: 0
# Model ids get retired (a 410 error says so). List the live ones with: story-agent models
# The judge is a different, larger model than the generator, so it does not mark its own work.
generator: nvidia/nemotron-3.5-lightning-30b-a3b
judge: nvidia/nemotron-3-ultra-550b-a55b
# Per-call output limit. null sends none, so the server's default applies and a reasoning
# model is not cut off while it thinks. Set a number to cap every call.
max_tokens: null
# Reasoning models can take minutes to answer. A call is retried max_retries times after a timeout.
timeout_s: 600
max_retries: 3
backoff_base_s: 1.0
# Nominal USD per million tokens, used only for the cost budget and cost metrics. The hosted
# free tier does not bill per token; set your real rate if you move to a paid host.
prices:
  nvidia/nemotron-3.5-lightning-30b-a3b: { input: 0.5, output: 0.5 }
  nvidia/nemotron-3-ultra-550b-a55b: { input: 1.0, output: 1.0 }
