[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "story-agent"
version = "0.1.0"
description = "Scenario to user story agent with discovery, clarification and memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7,<3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx2>=1.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25"]

[project.scripts]
story-agent = "story_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.5",
    "pre-commit>=3.7",
    "pip-licenses>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/story_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT",
    "D", "ANN", "PL", "TID", "T20", "PERF", "RET", "ARG", "PTH",
]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR0913", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true  # langgraph ships partial typing

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: calls the real model API (opt-in)"]

[tool.coverage.run]
source = ["story_agent"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
