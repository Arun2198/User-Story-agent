name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml
      - name: Coverage gate for guardrails and hooks
        run: uv run coverage report --include="src/story_agent/guardrails/*,src/story_agent/hooks/*" --fail-under=95

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Offline evals with regression gate
        run: uv run story-agent evals run --out eval-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval-reports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run bandit -q -r src -c pyproject.toml
      - run: uv export --no-dev --no-emit-project --locked -o requirements.txt
      - run: uv run pip-audit -r requirements.txt --disable-pip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pip-licenses --fail-on="GPL;AGPL;LGPL" --partial-match
      - run: uv run cyclonedx-py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
